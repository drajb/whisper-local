# =============================================================================
# WHISPER LOCAL - DEFAULT CONFIGURATION
# =============================================================================
# DO NOT EDIT THIS FILE
# This is the default configuration template for Whisper Local
#
# Personal settings are stored at:
# Windows: %APPDATA%\whisperkey\user_settings.yaml
# macOS: ~/.whisperkey/user_settings.yaml

whisper: # Whisper AI Model Settings
    # Backend engine
    # - faster_whisper (default): CTranslate2-based, GPU-friendly, mature
    # - whisper_cpp: opt-in via `pip install whisper-local[whispercpp]`.
    #   Better Apple Silicon perf, GGUF model format, lower memory.
    backend: faster_whisper

    # Model selection
    # See "models" below for more information
    # 'base' (~141 MB) is the default: noticeably more accurate than 'tiny' and
    # still real-time on CPU. Switch to 'tiny' for the smallest/fastest download,
    # or 'small'/'medium'/'large' for higher accuracy (GPU recommended for large).
    model: base

    # Transcription device
    # Options: cpu, cuda (for both NVIDIA and AMD)
    # For GPU setup, see https://github.com/drajb/whisper-local/blob/master/docs/gpu-setup.md
    device: cpu

    # Compute Precision
    # Options: int8, float16, float32
    compute_type: int8

    # Language detection
    # Options: auto (auto-detect), en, es, fr, de, etc.
    # Set to specific language code to force language, or auto for auto-detection
    language: auto

    # Transcription quality settings
    beam_size: 5 # Higher = more accurate but slower (1-10)

    # Initial prompt to guide transcription style, language variant, or script
    initial_prompt: ""

    # Custom hotwords — words the model should favor during transcription
    # Useful for names, technical terms, or domain-specific vocabulary
    # Example: ["CTranslate2", "PyInstaller", "Whisper Local"]
    hotwords: []

    # Smart prompt from selection: when true, the currently-selected text in
    # the active app (if any) is grabbed via Ctrl+C at recording start and
    # used as Whisper's initial_prompt for that single recording. Improves
    # accuracy when dictating edits to existing text (code, docs).
    prompt_from_selection: false

    # Whisper task: "transcribe" outputs in the source language, "translate"
    # outputs in English regardless of source language. The translate profile
    # toggles this; you can also flip it manually here.
    task: transcribe

    # Available models (set enabled: false to hide from menu)
    # To add custom models (CTranslate2 format), add entry with source (HuggingFace or local path)
    # Example: my-model: {source: "username/repo-ct2", label: "My Model", group: custom}
    models:
        # Official whisper models
        tiny:
            label: "Tiny (75MB)"
            group: official
            enabled: true
        base:
            label: "Base (141MB)"
            group: official
            enabled: true
        small:
            label: "Small (464MB)"
            group: official
            enabled: true
        medium:
            label: "Medium (1.4GB)"
            group: official
            enabled: true
        large: # Uses the large-v3 version
            label: "Large (2.9GB)"
            group: official
            enabled: true
        large-v3-turbo: # 8x faster and only slightly less accurate (transcription optimized)
            label: "Large-V3-Turbo (1.5GB)"
            group: official
            enabled: true

        # English-only models — same architecture as above, trained exclusively on English
        tiny.en:
            label: "Tiny.En (English, 74MB)"
            group: custom
            enabled: true
        base.en:
            label: "Base.En (English, 141MB)"
            group: custom
            enabled: true
        small.en:
            label: "Small.En (English, 464MB)"
            group: custom
            enabled: true
        medium.en:
            label: "Medium.En (English, 1.5GB)"
            group: custom
            enabled: true

        # Distilled models — smaller and faster than standard Whisper, English only
        distil-small.en:
            source: Systran/faster-distil-whisper-small.en
            label: "Distil-Small.En (English, 320MB)"
            group: custom
            enabled: true
        distil-medium.en:
            source: Systran/faster-distil-whisper-medium.en
            label: "Distil-Medium.En (English, 755MB)"
            group: custom
            enabled: true
        distil-large-v3.5: # ~1.5x faster than Large-V3-Turbo with comparable accuracy
            source: distil-whisper/distil-large-v3.5-ct2
            label: "Distil-Large-V3.5 (English, 1.4GB)"
            group: custom
            enabled: true

streaming: # Real-time STT (Experimental)
    # Real-time streaming speech recognition using sherpa-onnx
    streaming_enabled: false

    # Commit-on-endpoint delivery (experimental). When true AND streaming_enabled,
    # finalized phrases are typed to the cursor AS you speak (Wispr-Flow style),
    # and the final Whisper pass is skipped for that recording. Trade-off: you get
    # the lighter streaming model's accuracy, not the full Whisper transcription.
    # Only applies to plain dictation into a real text field with auto-paste on;
    # command/rephrase modes and copy-only/suppressed apps are unaffected.
    deliver_to_cursor: false

    # Streaming model type
    streaming_model: zipformer.tiny.en

    # Available streaming models
    # Requires sherpa-onnx streaming transducer models (e.g., Zipformer)
    # Browse models: https://k2-fsa.github.io/sherpa/onnx/pretrained_models/index.html
    models:
        zipformer.tiny.en:
            source: csukuangfj/sherpa-onnx-streaming-zipformer-en-20M-2023-02-17
            label: "Zipformer English Tiny (20MB)"
            files:
                encoder: encoder-epoch-99-avg-1.int8.onnx
                decoder: decoder-epoch-99-avg-1.int8.onnx
                joiner: joiner-epoch-99-avg-1.int8.onnx
                tokens: tokens.txt

hotkey: # Hotkey Configuration
    # Key combination to start recording
    # Format: modifier+modifier+key (use lowercase)
    # Windows modifiers: ctrl, shift, alt, win
    # macOS modifiers: cmd, ctrl, shift, option, fn
    # Examples:
    #   - "ctrl+win"      (Windows default)
    #   - "fn+ctrl"       (macOS default)
    #   - "ctrl+alt+r"
    #   - "win+v"
    #   - "ctrl+shift+f12"
    recording_hotkey: "ctrl+win | macos: fn+ctrl"

    # Key to stop recording (shared between transcription and command modes)
    stop_key: "ctrl | macos: fn"

    # Alternative stop key that also sends ENTER after pasting
    # Only works when auto-paste is enabled
    auto_send_key: "alt | macos: option"

    # Key combination to cancel recording
    # Format: modifier+modifier+key (use lowercase) or single key
    # Examples: "esc", "ctrl+c", "shift+esc"
    # Note: On macOS, ESC is system-reserved
    cancel_combination: "esc | macos: shift"

    # Recording mode
    # "push_to_talk" = hold hotkey to record, release to stop and transcribe (default)
    # "toggle" = press hotkey to start, press stop key to stop
    recording_mode: push_to_talk

    # Key combination for voice command mode
    # Records speech and matches against user-defined commands
    command_hotkey: "alt+win | macos: fn+command"

    # Key combination for AI rephrase mode
    # Select text first, hold this key, speak instructions like "make this concise".
    # Selection is sent to local Ollama with your instruction; result pastes back.
    # Leave empty to disable.
    rephrase_hotkey: "ctrl+shift+win | macos: ctrl+option+command"

    # Key combination to pause/resume all Whisper Local hotkeys
    # Press once to disable hotkey processing (so you can use the same keys
    # in another app); press again to resume. Leave empty to disable.
    pause_hotkey: "ctrl+alt+win | macos: ctrl+option+command+space"

    # Paste your last dictation again at the cursor, e.g. after it landed in the
    # wrong window. Leave empty to disable.
    paste_last_hotkey: "alt+shift+z | macos: ctrl+option+v"

    # Hands-free: in push-to-talk mode, double-tap the record hotkey to keep
    # recording without holding it, then tap it once more to stop. A single
    # hold works exactly as before. Off by default.
    double_tap_to_lock: false
    double_tap_window_ms: 400

vad: # Voice Activity Detection (VAD)
    # Voice Activity Detection (VAD) Pre-check
    # Uses TEN VAD to detect speech before transcription (prevents hallucinations on silence)
    # NOTE: This is separate from faster-whisper's built-in VAD
    vad_precheck_enabled: true

    # TEN VAD Hysteresis Thresholds (prevent flickering on borderline audio)
    vad_onset_threshold: 0.7 # Probability to START detecting speech (0.0-1.0)
    vad_offset_threshold: 0.55 # Probability to STOP detecting speech (0.0-1.0)

    # Minimum Duration Filtering
    vad_min_speech_duration: 0.1 # Minimum speech segment length in seconds (filters brief noise)

    # Real-time VAD monitoring during recording
    vad_realtime_enabled: true # Enables continuous silence detection and automatic recording stop
    vad_silence_timeout_seconds: 30.0 # Auto-stop recording after this many seconds of silence

audio: # Audio Recording Settings
    # Sample rate is fixed at 16000 Hz for optimal Whisper and TEN VAD performance

    # Audio host API selection
    # null = let Whisper Local choose the best option (WASAPI on Windows, first available elsewhere)
    # e.g., "WASAPI", "MME", "DirectSound", "Core Audio"
    host: null

    # Audio channels
    # 1 = mono (recommended for speech)
    # 2 = stereo
    channels: 1

    # Pause currently-playing media on recording start (Spotify, YouTube,
    # etc.) by sending the system play/pause key. Does NOT auto-resume.
    pause_media_on_record: false

    # Continuous dictation mode: after each successful delivery, the app
    # auto-restarts recording after a short delay. Press Esc (cancel
    # hotkey) to exit. Useful for long-form note dictation.
    continuous_mode: false

    # Recording format
    # Options: "float32", "int16", "int24", "int32"
    # float32 recommended for best quality
    dtype: float32

    # Maximum recording duration (seconds)
    # Set to 0 for unlimited recording
    max_duration: 900

    # Audio input device selection
    # "default" = Use system default microphone (default behavior)
    # <device_id> = Specific device ID number (set automatically when changed via system tray)
    #
    # Note: Device IDs are assigned by the operating system and may change if devices
    # are plugged/unplugged. Use system tray to select device - it will save the ID here.
    input_device: "default"

    # Noise suppression (requires: pip install 'whisper-local[noise]')
    # Applies spectral gating via noisereduce before passing audio to Whisper.
    # Helps in noisy environments (fans, HVAC, keyboard clatter).
    noise_suppression:
        enabled: false
        strength: 0.75  # 0.0 = minimal, 1.0 = aggressive

    # Whisper mode: boost quiet recordings (whispering in an open office, a
    # distant mic) before transcription. It only ever turns the volume UP, by at
    # most max_gain, so normal speech passes through untouched.
    whisper_mode:
        enabled: false
        max_gain: 8.0

clipboard: # Clipboard Behavior
    # Automatically paste after transcription
    # true = paste immediately to active window
    # false = only copy to clipboard (paste manually)
    #
    # NOTE: app_rules.yaml can override this per application, and the shipped
    # rules do — code editors (VS Code, Cursor, PyCharm, ...) are copy-only so
    # dictation never types into source unexpectedly. If a specific app only
    # copies, check app_rules.yaml before this setting.
    auto_paste: true

    # Delivery method for auto-paste
    # "paste" = clipboard copy + simulated Ctrl+V paste
    # "type" = direct text injection (Windows only)
    #     Avoids clipboard manipulation and sends keys individually
    delivery_method: "paste"

    # Key combination to simulate paste (only used when delivery_method is "paste")
    # Format: modifier+key (use lowercase)
    # Examples:
    #   - "ctrl+v"         (standard paste)
    #   - "ctrl+shift+v"   (plain text paste in some apps)
    #   - "shift+insert"   (terminal paste)
    paste_hotkey: "ctrl+v | macos: cmd+v"

    # Delay after clipboard copy, before sending paste hotkey (seconds, paste mode)
    # Lets clipboard listeners (e.g. Windows Clipboard History) finish reading
    paste_pre_paste_delay: 0.05

    # Restore original clipboard contents after delivery (paste mode)
    paste_preserve_clipboard: true

    # Delay before clipboard restore (seconds, paste mode)
    paste_clipboard_restore_delay: 0.5

    # Also copy transcription to clipboard after delivery (type mode)
    type_also_copy_to_clipboard: false

    # Delay before sending ENTER key after text injection (seconds, type mode)
    # Terminal apps need time to process typed characters before Enter submits
    # Total delay = type_auto_enter_delay + (characters / 100 * type_auto_enter_delay_per_100_chars)
    type_auto_enter_delay: 0.15
    type_auto_enter_delay_per_100_chars: 0.1

    # Delay for key simulation operations (seconds)
    # Small delay ensures operations complete reliably (macOS only)
    macos_key_simulation_delay: 0.05

logging: # Logging Configuration
    # Log level - how much detail to log
    # Options: "DEBUG", "INFO", "WARNING", "ERROR", "CRITICAL"
    # - DEBUG: Very detailed (for troubleshooting)
    # - INFO: General information (recommended)
    # - WARNING: Only warnings and errors
    # - ERROR: Only errors
    level: INFO

    # Log file settings
    file:
        enabled: true
        filename: app.log

    # Log transcription text content to log file
    # false = only log metadata (char count, language, timing) for privacy
    # true = include actual transcribed text in log entries
    log_transcriptions: false

    # Console output
    console:
        enabled: true
        level: WARNING # Console log level (DEBUG, INFO, WARNING, ERROR, CRITICAL) - WARNING shows important messages only

audio_feedback: # Audio Feedback Settings
    # Enable/disable audio feedback sounds
    # true = play sounds when recording starts/stops
    # false = silent operation
    enabled: true

    # Enable/disable audio feedback sounds when transcription stops
    # true = play sounds when transcription stops
    # false = silent operation
    transcription_complete_enabled: false

    # Play a short chime once the app has finished loading and the hotkey is live.
    # Model loading can take a while on a cold start and the app has no window,
    # so this is the clearest signal that it's ready.
    ready_enabled: true

    # Sound file paths (relative to project root or absolute paths)
    # Use .wav files for best Windows compatibility
    start_sound: assets/sounds/record_start.wav
    stop_sound: assets/sounds/record_stop.wav
    cancel_sound: assets/sounds/record_cancel.wav
    transcription_complete_sound: assets/sounds/transcription_complete.wav
    ready_sound: assets/sounds/app_ready.wav

terminal_title: # Terminal Tab Title Status
    # Shows "<prefix> Whisper Local" in the terminal tab, reflecting app state.
    # Useful when the tray icon is hidden in the overflow area. Ignored entirely
    # when stdout isn't a terminal (windowless launch, piped output).
    #
    # Each state is either a static prefix string, or a list of [prefix, seconds]
    # frames cycled as an animation.
    # Examples:
    #   idle: "🎤"
    #   processing:
    #       - ["⠂", 0.25]
    #       - ["⠐", 0.25]
    idle: ""
    recording:
        - ["🔴", 1.5]
        - ["⠀⠀", 1.0]
    processing: ""

system_tray: # System Tray Settings
    # Enable/disable system tray icon
    # true = show icon in system tray with status and menu
    # false = run without system tray (console mode only)
    enabled: true

    # Tooltip text when hovering over tray icon
    tooltip: Whisper Local

console: # Console Window Management (whisper-local-hideable.exe only)
    # Hide console window after startup (requires system tray)
    start_hidden: false

onboarding: # First-run setup state (managed automatically)
    # GPU acceleration setup status
    # pending | no_gpu | skipped | complete
    gpu: pending

    # Detected GPU class (set automatically)
    # nvidia | amd_rdna2+ | amd_rdna1 | null
    gpu_class: null

audit: # Append-only audit log (off by default)
    # When enabled, every successful delivery appends a line to
    # %APPDATA%/whisperkey/audit.log: timestamp + event + app +
    # char count. The transcript text itself is NOT logged.
    # Useful for compliance / journalists / accountability.
    enabled: false

voice_commands: # Voice Command Settings
    # Enable/disable voice commands feature
    # true = register command hotkey and load commands file
    # false = disable voice commands entirely
    # Define commands in commands.yaml (same folder as user_settings.yaml)
    enabled: true

overlay: # Floating speech-level overlay (Wispr-style bottom-center bar)
    # Show a thin pill at the screen edge while recording so you can see
    # Whisper Local is listening and reacting to your voice.
    enabled: true
    # Screen position: bottom-center | bottom-right | bottom-left
    #                  top-center | top-right | top-left
    position: bottom-center
    # When true, the overlay is transparent to mouse clicks (you can click
    # through it to apps below). Set to false if you want to interact with
    # the overlay itself.
    click_through: true

postprocess: # Transcription post-processing pipeline
    # Inline voice formatting: say "comma", "period", "new line", "new paragraph",
    # "question mark", "exclamation mark", "colon", "semicolon", "open quote",
    # "close quote", "open paren", "close paren", "dash", "hyphen"
    inline_formatting: true

    # Custom phrase -> symbol replacements for inline_formatting. Runs after Whisper
    # and before any Ollama step. Essential for NON-ENGLISH dictation: when Whisper
    # transcribes (say) Polish, the built-in English triggers above won't appear, so
    # define your own. Matching is whole-word and case-insensitive.
    #
    # By default your list REPLACES the English built-ins. To keep the English
    # defaults AND add your own, set inline_formatting_extend: true below.
    #
    # Example (Polish):
    # inline_formatting_replacements:
    #   - phrase: przecinek      # comma
    #     replacement: ","
    #   - phrase: strzałka       # arrow
    #     replacement: "→"
    #   - phrase: otwórz nawias  # open paren
    #     replacement: " ("
    inline_formatting_replacements: []
    inline_formatting_extend: false

    # When you speak a cue word ("comma", "arrow", ...), Whisper adds its OWN
    # punctuation around it from prosody, e.g. "hello comma world" is transcribed
    # "Hello, comma, world." A plain swap then leaves artifacts ("Hello,, world.").
    # Turn this on to also eat the commas/periods/whitespace hugging each cue word,
    # letting the replacement string carry its own spacing. Pair it with
    # replacements that bake in spacing, e.g. ", " / " → " / " (".
    # Example:
    # inline_formatting_absorb_punctuation: true
    # inline_formatting_replacements:
    #   - phrase: przecinek
    #     replacement: ", "
    #   - phrase: strzałka
    #     replacement: " → "
    inline_formatting_absorb_punctuation: false

    # Spoken editing commands. When on, say "scratch that" (or "delete that" /
    # "strike that") to erase what you just said back to the start of the current
    # sentence — e.g. "book the flight, scratch that, cancel it" → "cancel it".
    # Deterministic and offline. Off by default.
    voice_editing: false

    # Deterministic smart formatting — turns spoken forms into typed symbols,
    # offline, with no LLM. Each toggle is independent and OFF by default because
    # it rewrites text; turn on only what you want.
    #   times:  "3 p.m." / "3:30pm"        → "3 PM" / "3:30 PM"
    #   emails: "john at example dot com"  → "john@example.com"
    #   urls:   "example dot com"          → "example.com"
    # emails/urls fire on a trailing known TLD (com, org, net, io, ...). They are
    # aggressive by design: prose of the same shape is rewritten too — "we met at
    # google dot com" → "we met@google.com", "the dot com era" → "the.com era".
    # Enable only if you actually dictate addresses; leave off for plain prose.
    smart_formatting:
        times: false
        emails: false
        urls: false

    # Post-transcription corrections: literal, whole-word, case-insensitive text
    # fixes applied after Whisper and before any Ollama step. Use this for
    # consistent misrecognitions ("see translate two" → "CTranslate2"). The
    # history window can append here for you via "Fix this everywhere...".
    # Each entry: from (required), to, whole_word (default true),
    # case_sensitive (default false), regex (default false — advanced).
    # Example:
    # replacements:
    #   - from: see translate two
    #     to: CTranslate2
    #   - from: my sequel
    #     to: MySQL
    replacements: []

    # Vocabulary corrections: one canonical spelling, many misheard variants.
    # Use this when Whisper mangles the SAME term several different ways — you
    # write the correct form once and list what you actually hear back.
    # Matching is whole-word and case-insensitive; the replacement is inserted
    # exactly as written here. All variants are applied in a single pass, and a
    # longer variant always wins over a shorter one it contains.
    #
    # Tip: try whisper.hotwords first — that biases the model itself. These are
    # the deterministic backstop for terms it still gets wrong.
    # Example:
    # corrections:
    #     CAPEX: [cap x, copics]
    #     CTranslate2: [see translate two]
    #     MySQL: [my sequel]
    corrections: {}


    # Writing style: one choice that sets capitalization, final punctuation and
    # casing together. Leave "" to use the individual toggles in this section.
    #   formal      - capitalized, always ends with punctuation (email, docs)
    #   casual      - capitalized, no trailing period (chat)
    #   very_casual - all lowercase except acronyms and your own terms, no period
    #   verbatim    - no automatic capitals, periods or lists (code, terminals)
    # app_rules.yaml can pick a different style per app (`style: casual`).
    # Redefine a preset or add your own under `styles`, using any of:
    # capitalize_first, ensure_punctuation, strip_trailing_period,
    # inline_formatting, lowercase, list_formatting. Example:
    # styles:
    #     shouty: {capitalize_first: true, ensure_punctuation: true}
    style: ""
    styles: {}

    # Backtrack: correct yourself mid-sentence and only the correction is kept.
    # "Let's meet at 2, actually 3" → "Let's meet at 3".
    # "Ship it Tuesday, no wait, Wednesday" → "Ship it Wednesday".
    # It acts only when a cue is followed by a number, time, weekday or month
    # that replaces an earlier one in the same sentence, so everyday prose like
    # "I actually like it" is never changed. Deterministic and offline.
    backtrack:
        enabled: false
        cues: [actually, i mean, no wait, wait no, sorry, make that, or rather, correction]

    # Remove stutters and restarts: "I I think" → "I think". Genuine doubles
    # ("had had", "that that") and emphasis ("very very") are kept.
    remove_repeated_words: false

    # Spoken lists: "first, milk. second, eggs. third, bread" becomes a list on
    # separate lines. Fires only on markers counting up from one (first/second,
    # one/two, number one/number two), each followed by punctuation, so prose
    # like "one of the two options" is left alone.
    # Heads-up: a new line can send a message in chat apps. The verbatim style
    # turns lists off, and app rules can do it per app.
    list_formatting: false
    list_style: numbered   # numbered | bullets

    # Lowercase ordinary words, keeping acronyms (NASA), mixed case (iPhone)
    # and your own corrections as written. The very_casual style turns it on.
    lowercase: false

    # Snippets: spoken shortcuts expanded inline in normal dictation, with no
    # special hotkey. Say the trigger anywhere and the expansion is typed.
    #   trigger:   what you say ("my signature"); case and punctuation don't matter
    #   expansion: what gets typed. ${date}, ${time} and ${clipboard} are filled in
    #   mode:      anywhere (default) | alone (only when it's the whole dictation)
    # Example:
    # snippets:
    #   - trigger: my signature
    #     expansion: "Best,\nRohit"
    #   - trigger: my address
    #     expansion: "1 Main St, Dallas, TX 75201"
    #     mode: alone
    snippets: []

    # Strip "um", "uh", "like", "you know" filler words
    strip_filler_words: false

    # Whisper often appends a period to the final segment even when you
    # didn't actually end with a full stop. Toggle to remove it.
    strip_trailing_period: false

    # Force first letter uppercase
    capitalize_first: false

    # Append a period if the text doesn't end in punctuation
    ensure_punctuation: false

    # Optional local LLM cleanup via Ollama (https://ollama.ai)
    # Off by default. Requires Ollama running locally on the configured endpoint.
    ollama:
        enabled: false
        endpoint: http://localhost:11434
        model: llama3.2
        timeout: 5
        prompt: |-
            Polish this dictation. Fix punctuation and capitalization only. Do not change wording or add anything. Output ONLY the polished text:

            {text}

update_check: # Opt-in update notifications
    # When enabled, once per day Whisper Local checks the GitHub releases API
    # for a newer version and shows a tray notification if found.
    # No audio or transcript data is ever sent. Only the app version is in the UA header.
    # Set to true to opt in.
    enabled: false
